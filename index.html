<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Price List TRAVO</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9edf2;--card:#ffffff;--text:#1c2430;--muted:#566175;--line:#c3cad4;--accent:#23864f;color-scheme:light;--lock:#d9f3e3;--neg:#d0452a;--onacc:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}

:root[data-accent="green"]{--accent:#16a34a}
:root[data-accent="teal"]{--accent:#0d9488}
:root[data-accent="orange"]{--accent:#ea580c}
:root[data-accent="rose"]{--accent:#e11d48}
:root[data-accent="purple"]{--accent:#7c3aed}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Sarabun',system-ui,sans-serif;font-size:14px;padding-bottom:90px}
h1{font-size:17px;margin:0;padding:10px 12px 2px}
.sec{padding:8px 12px 0;color:var(--muted);font-size:12px;font-weight:600}
.models{display:flex;gap:8px;overflow-x:auto;padding:6px 12px}
.chip{flex:none;border:2px solid #9aa4b2;background:var(--card);color:var(--text);border-radius:10px;padding:5px 9px;font:inherit;font-size:13px;text-align:left}
.chip small{display:block;color:var(--neg);font-size:11px}
.chip.on{border-color:var(--accent);background:var(--accent);color:var(--onacc)}
.chip.on small{color:var(--onacc);opacity:.9}
.list{margin:6px 12px}
.sc{margin:0 0 12px;background:var(--card);border:2px solid #9aa4b2;border-radius:12px;overflow:hidden}
label.row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
label.row:last-child{border-bottom:0}
label.row.locked{cursor:default;background:#dde1e8;color:#2e3747}
.wh,.wr{display:grid;grid-template-columns:32px 1fr 1fr 62px;align-items:stretch}
.wh{background:#efe8d9;color:var(--text);font-size:12px;font-weight:700;border-bottom:2px solid var(--line)}
.wh span{padding:5px 6px;border-left:1px solid var(--line)}
.wh span:first-child{border:0}
.wr{border-bottom:1px solid var(--line);cursor:pointer}
.wr input{width:20px;height:20px;margin:auto;accent-color:var(--accent)}
.wr .c{padding:7px 5px;border-left:1px solid var(--line);font-size:12px;line-height:1.3;display:flex;flex-direction:column;justify-content:center}
.wr .c b{font-weight:400;margin-top:1px;font-size:10.5px;color:var(--muted)}
.wr .c.t b{font-weight:700;font-size:15px;color:var(--text);margin:0}
.wr:has(input:checked){background:var(--lock)}
.gh{padding:9px 12px;font-size:13px;font-weight:700;color:#fff}.gh.g1{background:var(--accent)}.gh.g2{background:#4b5563}.gh.g3{background:#111827}.gh.err{background:#991b1b;box-shadow:inset 0 0 0 3px #fff}
.row input{width:21px;height:21px;flex:none;accent-color:var(--accent)}
.row .n{flex:1;line-height:1.25;font-weight:600}
.row .p{font-weight:600;white-space:nowrap}
.row .p small{display:block;color:var(--muted);font-weight:400;font-size:12px;text-align:right}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:3px solid var(--accent);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}
.ln{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.ln.neg b{color:var(--neg)}
.tot{display:flex;justify-content:space-between;align-items:center;margin:2px 0 6px;font-size:18px;color:var(--accent);font-weight:700}
.btn{width:100%;border:0;border-radius:12px;background:var(--accent);color:var(--onacc);font:inherit;font-weight:700;padding:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:420px;max-height:85%;overflow:auto;border-radius:18px;padding:18px 16px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.sheet h2{margin:0 0 4px;font-size:19px}
.sr{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.sr.neg{color:var(--neg)}
.sr.t{border:0;font-size:21px;font-weight:700;padding-top:14px}
.btns{display:flex;gap:8px;margin-top:12px}
.btn.alt{background:var(--line);color:var(--text)}
.bar{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px))}
.ln{gap:12px;line-height:1.3}
.tot{flex-direction:column;align-items:flex-end;margin:0;font-size:22px;line-height:1.05}
.tot span:first-child{font-size:11px;font-weight:600}
.bar .btn{grid-column:1/-1;padding:8px;font-size:15px}
.bar{left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border:0;border-radius:16px;padding:8px 8px 8px 14px;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.bar .c{flex:1;min-width:0;line-height:1.15}
.bar .c small{display:block;font-size:10.5px;opacity:.85}
.bar .c b{font-size:13px;font-weight:600}
.bar .c.n b{font-size:18px;font-weight:700}
.bar .btn{flex:none;width:auto;grid-column:auto;background:#fff;color:var(--accent);border-radius:999px;padding:9px 16px;font-size:14px}
.bar{background:var(--card);color:var(--text);border:2px solid #9aa4b2;padding:7px 7px 7px 14px}
.bar .c small{color:var(--muted);opacity:1;font-weight:600}
.bar .c b{color:var(--text)}
.bar .c:nth-child(2) b{color:var(--neg)}
.bar .btn{flex:1.4;background:var(--accent);color:#fff;border-radius:12px;padding:7px 14px;text-align:left}
.bar .btn small{display:block;font-size:10.5px;font-weight:600;opacity:.9}
.bar .btn b{display:block;font-size:19px;font-weight:700;line-height:1.15}
.bar .btn{flex:none;display:flex;align-items:center;gap:10px;background:var(--accent);color:#fff;border-radius:999px;padding:5px 5px 5px 16px;text-align:center}
.bar .btn b{display:inline;font-size:18px;font-weight:700;line-height:1}
.bar .btn .go{background:#fff;color:var(--accent);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:700}
.hint{padding:14px 12px;color:var(--muted);font-size:13px}
.models select{width:100%;font:inherit;font-size:15px;font-weight:600;padding:10px 12px;border:2px solid #9aa4b2;border-radius:10px;background:var(--card);color:var(--text)}
.wg{display:grid;grid-template-columns:1fr 1fr}
.wcol+.wcol{border-left:2px solid var(--line)}
.wch{padding:6px 10px;background:#efe8d9;font-size:12px;font-weight:700;border-bottom:2px solid var(--line)}
.wo{display:flex;align-items:center;gap:8px;padding:10px;border-bottom:1px solid var(--line);cursor:pointer}
.wo input{width:20px;height:20px;flex:none;accent-color:var(--accent)}
.wo .wn{display:block;font-size:13px;font-weight:600}
.wo b{display:block;font-size:14px}
.sc.wsc{border-color:var(--accent)}
.wsc label.wo:has(input:checked){background:var(--lock)}
.gh.g4{background:#0f766e}
.sc.tr{border-color:#0f766e}
.sc.tr input{accent-color:#0f766e}
.sc.tr label:has(input:checked){background:#d4efeb}
.gh.err{background:#991b1b;box-shadow:inset 0 0 0 3px #fff}
.models select{appearance:none;-webkit-appearance:none;background:var(--accent) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='3'><path d='M6 9l6 6 6-6'/></svg>") no-repeat right 12px center;color:#fff;border-color:var(--accent);padding-right:36px}
.gh.g1{background:#facc15;color:#1f1a00}
.sc.wsc{border-color:#ca8a04}
.wo input{accent-color:#ca8a04}
.wsc label.wo:has(input:checked){background:#fef3c7}
.gh.err{background:#991b1b;color:#fff;box-shadow:inset 0 0 0 3px #fff}
.models{display:block;overflow:visible;padding:8px 12px}
.msel{width:100%;display:flex;justify-content:space-between;align-items:center;background:var(--accent);color:#fff;border:2px solid var(--accent);border-radius:10px;padding:10px 12px;font:inherit;font-size:15px;font-weight:600}
.mpanel{margin-top:6px;background:var(--card);border:2px solid var(--accent);border-radius:12px;padding:8px 10px}
.mg+.mg{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.mgt{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}
.mps{display:flex;gap:8px;flex-wrap:wrap}
.mp{flex:0 0 calc(50% - 4px);border:2px solid #9aa4b2;background:var(--card);color:var(--text);border-radius:10px;padding:6px 10px;font:inherit;font-size:14px;font-weight:600;text-align:left}
.mp small{display:block;color:var(--neg);font-size:11px}
.mp.on{background:var(--accent);border-color:var(--accent);color:#fff}
.mp.on small{color:#fff}
.wbody{padding:8px 10px}
.wp{flex:0 0 calc(50% - 4px);border:2px solid #9aa4b2;background:var(--card);color:var(--text);border-radius:10px;padding:6px 10px;font:inherit;font-size:14px;font-weight:600;text-align:left}
.wp small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.wp.on{background:#fef3c7;border-color:#ca8a04;color:#713f12}
.wp.on small{color:#713f12}
.mp.on{background:color-mix(in srgb,var(--accent) 13%,var(--card));border-color:var(--accent);color:var(--accent)}
.mp.on small{color:var(--neg)}
.tg{width:100%;display:flex;justify-content:space-between;align-items:center;border:2px solid;border-radius:10px;padding:10px 12px;font:inherit;font-size:15px;font-weight:600;text-align:left}
.tg.m{background:var(--accent);color:#fff;border-color:var(--accent)}
.tg.w{background:#facc15;color:#1f1a00;border-color:#ca8a04}
.tg.t{background:#0f766e;color:#fff;border-color:#0f766e}
.tg:disabled{background:#dde1e8;color:#5b6678;border-color:#9aa4b2}
.pkb{padding:8px 10px}
.mpanel.w{border-color:#ca8a04}
.mpanel.t{border-color:#0f766e}
.pl{flex:0 0 calc(50% - 4px);border:2px solid #9aa4b2;background:var(--card);color:var(--text);border-radius:10px;padding:6px 10px;font:inherit;font-size:14px;font-weight:600;text-align:left}
.pl small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.pl.m small{color:var(--neg)}
.pl.m.on{background:color-mix(in srgb,var(--accent) 13%,var(--card));border-color:var(--accent);color:var(--accent)}
.pl.w.on{background:#fef3c7;border-color:#ca8a04;color:#713f12}
.pl.w.on small{color:#713f12}
.pl.t.on{background:#d4efeb;border-color:#0f766e;color:#0f4f49}
.pl.t.on small{color:#0f4f49}
.pl:disabled{background:#e4e8ee;color:#7d8798;cursor:not-allowed}
.mg.dis{opacity:.5}
.gh.g1,.gh.g3,.gh.g4{background:#1f2937;color:#fff}
.gh.g2{background:#5b6678;color:#fff}
.gh.err{background:#991b1b;color:#fff;box-shadow:inset 0 0 0 3px #fff}
.sc,.sc.wsc,.sc.tr{border-color:#9aa4b2}
.tg.m,.tg.w,.tg.t{background:var(--card);color:var(--text);border-color:#9aa4b2}
.tg:disabled{background:#dde1e8;color:#5b6678;border-color:#c3cad4}
.mpanel,.mpanel.w,.mpanel.t{border-color:#9aa4b2}
.pl.m.on,.pl.w.on,.pl.t.on{background:color-mix(in srgb,var(--accent) 13%,var(--card));border-color:var(--accent);color:var(--accent)}
.pl small,.pl.m small,.pl.w.on small,.pl.t.on small,.pl.m.on small{color:var(--muted)}
.gh.g1{background:#9a6a14;color:#fff}
.gh.g4{background:#5b6636;color:#fff}
.gh.g3{background:#4a3b2c;color:#fff}
.gh.g2{background:#5b6678;color:#fff}

.sc.wsc,.mpanel.w{border-color:#c9a45c}

.gh.g1{background:#7a4f0a}

.sc.wsc,.mpanel.w{border-color:#7a4f0a}

.row .n{font-weight:700}
label.row.locked{color:#2e3747}

.pl.ts.s0.on{background:#c6ecd5}
.pl.ts.s1.on{background:#c4e9e5}
.pl.ts.s2.on{background:#e0eebf}
.mgt.tsh{display:flex;align-items:center;gap:10px}
.tsb{border:0;border-radius:999px;background:rgba(255,255,255,.22);color:#fff;font:inherit;font-size:13px;font-weight:700;padding:3px 10px}
.mpanel.t .mgt.tsh2{background:#1b6b43}
.pl.ts{padding:12px}
.mpanel.m .mg{border:2px solid;border-radius:12px;overflow:hidden;padding:0 0 8px}
.mpanel.m .mgt{border-radius:0;margin:0 0 8px}
.mpanel.m .mps{padding:0 8px}
.pl.m{font-size:16px;padding:10px 12px;border-width:2px;background:#fff}
.pl.m small{font-size:12px;color:#566175}
.pl.m.on small{color:inherit}
.mpanel.m .mg.gm0{background:#fbeae6;border-color:#efb5a8}
.mg.gm0 .pl.m{border-color:#c8402a;color:#8f2a18}
.mg.gm0 .pl.m.on{background:#f6cfc6;border-color:#c8402a;color:#8f2a18}
.mpanel.m .mg.gm1{background:#efe9fa;border-color:#cdbdee}
.mg.gm1 .pl.m{border-color:#6d45b8;color:#46298a}
.mg.gm1 .pl.m.on{background:#dccff3;border-color:#6d45b8;color:#46298a}
.mpanel.m .mg.gm2{background:#e8ebf0;border-color:#b9c0cc}
.mg.gm2 .pl.m{border-color:#2f3a4f;color:#1e2736}
.mg.gm2 .pl.m.on{background:#cfd5df;border-color:#2f3a4f;color:#1e2736}
.bar .btn{background:#e11d48;color:#fff}
.bar .btn b{color:#fff}
.bar .btn .go{background:#fff;color:#e11d48}
</style>
</head>
<body>
<h1>Price List TRAVO</h1>
<div class="sec">เลือกรุ่น</div>
<div class="models" id="models"></div>
<div class="sec">รายการ</div>
<div class="list" id="list"></div>

<div class="bar">
  <div class="c"><small>รวม</small><b id="sub">0</b></div>
  <div class="c"><small>เทิร์น</small><b id="turn">0</b></div>
  <button class="btn" id="sum"><b id="net">0</b><span class="go">สรุป</span></button>
</div>

<div class="modal" id="modal"><div class="sheet">
  <h2 id="mt"></h2>
  <div id="mb"></div>
  <div class="btns"><button class="btn alt" id="copy">คัดลอก</button><button class="btn" id="close">ปิด</button></div>
</div></div>

<div class="modal" id="pop"><div class="sheet"><div class="ph"><h2 id="pt"></h2><button class="x" id="pcl" aria-label="ปิด">✕</button></div><div class="stp" id="pst"></div><div id="pb"></div><div class="btns" id="pnav"><button class="btn alt" id="pprev">‹ ก่อนหน้า</button><button class="btn" id="pnext">ถัดไป ›</button></div></div></div>

<script>
// ===== ข้อมูล: แก้ราคาได้ที่นี่ =====
// ล้อ: rim = ขนาดขอบ (18 หรือ 20) ใช้จับคู่กับยางที่ใส่ได้
const WHEELS=[
 {id:'w1',name:'ขอบ 9"X18"+0',rim:18,price:15000},
 {id:'w2',name:'ขอบ 9.5"X20"+0',rim:20,price:15000},
 {id:'w3',name:'ขอบ 10"X20"-24',rim:20,price:22000}
];
// ยาง: แยกตามขนาดขอบ (ขอบ 18 มี 1 ตัวเลือก, ขอบ 20 มี 2 ตัวเลือก) เพิ่ม/แก้ข้อมูลยางได้ที่นี่
const TIRES={
 18:[
  {id:'t1',size:'265/60R18',brand:'DCENTI',model:'AT',price:15000,desc:''},
  {id:'t2',size:'265/60R18',brand:'DCENTI',model:'RT',price:17000,desc:''},
  {id:'t3',size:'265/60R18',brand:'TOYO',model:'OPAT3',price:28000,desc:''},
  {id:'t4',size:'265/60R18',brand:'TOYO',model:'OPRT',price:28000,desc:''},
  {id:'t5',size:'265/60R18',brand:'BF GOODRICH',model:'KO3',price:34000,desc:'WL'},
  {id:'t6',size:'265/65R18',brand:'DCENTI',model:'AT',price:15000,desc:''},
  {id:'t7',size:'265/65R18',brand:'DCENTI',model:'RT',price:17000,desc:''},
  {id:'t8',size:'265/65R18',brand:'TOYO',model:'OPAT3',price:28000,desc:''},
  {id:'t9',size:'265/65R18',brand:'BF GOODRICH',model:'KO3',price:36000,desc:'WL'}
 ],
 20:[
  {id:'t10',size:'265/50R20',brand:'DCENTI',model:'AT',price:15000,desc:''},
  {id:'t11',size:'265/50R20',brand:'DCENTI',model:'RT',price:18000,desc:''},
  {id:'t12',size:'265/50R20',brand:'TOYO',model:'OPAT3',price:28000,desc:''},
  {id:'t13',size:'265/50R20',brand:'TOYO',model:'OPRT',price:32000,desc:''},
  {id:'t14',size:'275/55R20',brand:'DCENTI',model:'AT',price:17000,desc:''},
  {id:'t15',size:'275/55R20',brand:'DCENTI',model:'RT',price:20000,desc:''},
  {id:'t16',size:'275/55R20',brand:'TOYO',model:'OPAT3',price:32000,desc:''},
  {id:'t17',size:'275/55R20',brand:'TOYO',model:'OPRT',price:35000,desc:''},
  {id:'t18',size:'275/55R20',brand:'BF GOODRICH',model:'KO3',price:48000,desc:'BL'},
  {id:'t19',size:'33*12.5R20',brand:'ARISUN',model:'RT',price:22000,desc:'BL'},
  {id:'t20',size:'33*12.5R20',brand:'OTANI',model:'SA2100',price:22000,desc:'WL'}
 ]
};
const OPTIONS=[
 {id:'lift2',name:'ยก 2"',price:3500},
 {id:'lift',name:'ชุดยกปีกนก',price:16000},
 {id:'axle',name:'ต่อเพลา',price:6500},
 {id:'slide',name:'รถสไลด์',price:4000},
 {id:'shock',name:'โช๊ค PROFENDER',price:39500}
];
const LIFT=['lift','axle'];
const GC={'B-CAB':'#c8402a','PREMIUM':'#6d45b8','OVERLAND':'#2f3a4f'};
const MODELS=[
 {g:'B-CAB',v:'4X2',name:'TRAVO B-CAB 4X2',turn:-7000,locked:['lift'],color:'#c8402a'},
 {g:'B-CAB',v:'4X4',name:'TRAVO B-CAB 4X4',turn:-7000,locked:['lift','axle'],color:'#c76a0a'},
 {g:'PREMIUM',v:'PREMIUM',name:'TRAVO PREMIUM',turn:-18000,locked:['lift'],color:'#6d45b8'},
 {g:'OVERLAND',v:'4X2',name:'TRAVO OVERLAND 4X2',turn:-22000,locked:['lift'],color:'#b02a74'},
 {g:'OVERLAND',v:'4X4',name:'TRAVO OVERLAND 4X4',turn:-22000,locked:['lift','axle'],color:'#2f3a4f'}
];
// ====================================
const fmt=n=>(n<0?'-':'')+Math.abs(n).toLocaleString('en-US');
const $=id=>document.getElementById(id);
let tsize=null, prevOpened=null;
let cur=-1, picked=new Set(), wheel=null, tire=null, opened=null, customTire=null, draft={brand:'',size:'',price:''};
const getW=()=>WHEELS.find(x=>x.id===wheel)||null;
const tname=x=>x.size+' '+x.brand+' '+x.model+(x.desc?' ('+x.desc+')':'');
const tireHTML=w=>{
  const list=TIRES[w.rim]||[], sizes=[...new Set(list.map(x=>x.size))];
  if(!tsize||!sizes.includes(tsize)){
    return '<div class="mpanel t"><div class="mgt tsh2">เลือกขนาดยาง</div><div class="mps">'+sizes.map((sz,si)=>{
      const its=list.filter(x=>x.size===sz), min=Math.min(...its.map(x=>x.price));
      const on=(tire==='custom'&&customTire&&customTire.size===sz)||its.some(x=>x.id===tire);
      return `<button class="pl ts s${si%3} ${on?'on':''}" data-k="ts" data-id="${sz}">${sz}</button>`;
    }).join('')+'</div></div>';
  }
  const si=sizes.indexOf(tsize), its=list.filter(x=>x.size===tsize), bs=[...new Set(its.map(x=>x.brand))];
  return `<div class="mpanel t"><div class="mg s${si%3}"><div class="mgt tsh"><button class="tsb" id="tszback">‹ ขนาดอื่น</button><span>${tsize}</span></div>`
   +bs.map(b=>`<div class="bg"><div class="bgt">${b}</div><div class="mps">${its.filter(x=>x.brand===b).map(x=>pl('t',x.id,x.model,fp(x.price)+(x.desc?' · '+x.desc:''),tire===x.id)).join('')}</div></div>`).join('')
   +`<div class="mps"><button class="pl t add ${tire==='custom'&&customTire&&customTire.size===tsize?'on':''}" data-k="t" data-id="custom" data-size="${tsize}">+ ระบุเอง<small>ยี่ห้อ / ราคา</small></button></div></div></div>`;
};
const getT=()=>{
  if(tire==='custom'&&customTire)return {id:'custom',name:((customTire.size||'')+' '+(customTire.brand||'')).trim(),price:customTire.price,size:customTire.size};
  const w=getW();const x=w?(TIRES[w.rim]||[]).find(y=>y.id===tire):null;return x?{id:x.id,name:tname(x),price:x.price,size:x.size}:null};
const esc=v=>String(v==null?'':v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const formHTML=()=>`<div class="fm"><label>ยี่ห้อ<input id="cb" type="text" value="${esc(draft.brand)}" placeholder="พิมพ์ยี่ห้อยาง"></label><label>ขนาดยาง<input id="cs" type="text" value="${esc(draft.size)}"></label><label>ราคา (บาท)<input id="cp" type="number" inputmode="numeric" value="${esc(draft.price)}"></label><div id="cerr" class="cerr"></div><div class="btns"><button class="btn alt" id="tback">‹ กลับ</button><button class="btn" id="tok">ตกลง</button></div></div>`;

function selectModel(i){
  cur=i; picked=new Set([...MODELS[i].locked,'slide']); wheel=null; tire=null; opened=null; customTire=null;
  render();
}
const fp=p=>p==null?'กดใส่ราคา':fmt(p);
const pl=(k,id,label,sub,on,dis,st)=>`<button class="pl ${k} ${on?'on':''}" data-k="${k}" data-id="${id}" ${dis?'disabled':''} style="${st||''}">${label}<small>${sub}</small></button>`;
const panel=(k,groups)=>`<div class="mpanel ${k}">${groups.map(g=>`<div class="mg ${g.dis?'dis':''} ${g.cls||''}"><div class="mgt" ${g.c?`style="background:${g.c};color:#fff"`:''}>${g.t}</div><div class="mps">${g.items.join('')}</div></div>`).join('')}</div>`;
const tg=(k,text,dis)=>`<button class="tg ${k}" data-t="${k}" ${dis?'disabled':''}><span>${text}</span><span>${opened===k?'▴':'▾'}</span></button>`;
function render(){
  const m=MODELS[cur]||null, w=getW(), t=getT();
  if(opened==='t'&&prevOpened!=='t'&&prevOpened!=='tc'){tsize=t?t.size:null}
  prevOpened=opened;
  const mg=[...new Set(MODELS.map(x=>x.g))].map((g,gi)=>({t:'TRAVO '+g,c:GC[g],cls:'gm'+gi,items:MODELS.map((x,i)=>x.g===g?pl('m',i,x.v,'เทิร์น '+fmt(x.turn),i===cur):'').filter(Boolean)}));
  const sv=(k,label,val,ph,dis,st)=>`<div class="sr2"><span class="sl">${label} :</span><button class="sv ${k} ${val?'':'empty'}" id="v-${k}" data-t="${k}" ${dis?'disabled':''} ${st?`style="${st}"`:''}>${val||ph}</button></div>`;
  $('models').innerHTML='<div class="selcard">'
   +sv('m','รุ่นรถ',m?m.name:'','แตะเพื่อเลือก')
   +sv('w','ล้อ',w?`${w.name} · ${fmt(w.price)}`:'',m?'แตะเพื่อเลือก':'เลือกรุ่นก่อน',!m)
   +sv('t','ยาง',t?`${t.name} · ${fp(t.price)}`:'',w?'แตะเพื่อเลือก':'เลือกล้อก่อน',!w)
   +'</div>';
  const wg=[18,20].map(r=>({t:`ขอบ ${r}"`,items:WHEELS.filter(x=>x.rim===r).map(x=>pl('w',x.id,x.name.replace('ขอบ ',''),fmt(x.price),wheel===x.id))}));
  let h='';
  const tgp=w?tireHTML(w):'';
  const row=o=>{const lk=LIFT.includes(o.id)||!m;
    return `<label class="row ${lk?'locked':''}"><input type="checkbox" data-k="o" data-id="${o.id}" ${picked.has(o.id)?'checked':''} ${lk?'disabled':''}><span class="n">${o.name}</span><span class="p">${fmt(o.price)}</span></label>`};
  h+='<div class="sc"><div class="gh g2">รายการยก · 🔒 ชุดยกปีกนก/ต่อเพลา ล็อกตามรุ่น</div>'+OPTIONS.filter(o=>o.id==='lift2'||LIFT.includes(o.id)).map(row).join('')+'</div>';
  h+='<div class="sc"><div class="gh g3">รายการเสริม</div>'+OPTIONS.filter(o=>o.id!=='lift2'&&!LIFT.includes(o.id)).map(row).join('')+'</div>';
  $('list').innerHTML=h;
  const pops={m:['เลือกรุ่น',()=>panel('m',mg)],w:['เลือกล้อ',()=>panel('w',wg)],t:['เลือกยาง · ขอบ '+(w?w.rim:'')+'"',()=>tgp+'<div class="leg">WL = ตัวอักษรขาว · BL = ตัวอักษรดำ</div>'],tc:['ระบุยางเอง',formHTML]};
  if(opened){$('pt').textContent=pops[opened][0];$('pb').innerHTML=pops[opened][1]();$('pop').firstElementChild.className='sheet '+(opened==='tc'?'t':opened);$('pop').classList.add('show');
    const steps=['m','w','t'], si=steps.indexOf(opened), has={m:!!m,w:!!w,t:!!t};
    $('pnav').style.display=si<0?'none':'flex';
    $('pst').innerHTML=si<0?'':steps.map((k,i)=>`<span class="${i===si?'on':''}">${['รุ่นรถ','ล้อ','ยาง'][i]}</span>`).join('<i>›</i>');
    $('pprev').disabled=si<=0;
    $('pnext').disabled=si<0?true:!has[opened];
    $('pnext').textContent=si===2?'เสร็จสิ้น':'ถัดไป ›';
  }
  else $('pop').classList.remove('show');
  calc();
}
function chosen(){
  const items=[], w=getW(), t=getT();
  if(w)items.push({name:'ล้อ'+w.name,price:w.price});
  if(t)items.push({name:'ยาง '+t.name,price:t.price||0});
  OPTIONS.filter(o=>picked.has(o.id)).forEach(o=>items.push({name:o.name,price:o.price}));
  return items;
}
function calc(){
  const m=MODELS[cur]||null;
  const sub=chosen().reduce((s,o)=>s+o.price,0);
  $('sub').textContent=fmt(sub);
  $('turn').textContent=m?fmt(m.turn):'-';
  $('net').textContent=fmt(sub+(m?m.turn:0));
}
document.addEventListener('click',e=>{
  const p=e.target.closest('.pl'), g=e.target.closest('.tg,.sv');
  if(e.target.id==='pprev'||e.target.id==='pnext'){
    const st=['m','w','t'], i=st.indexOf(opened);
    if(e.target.id==='pprev'){if(opened==='t'&&tsize){tsize=null}else if(i>0)opened=st[i-1]}else{opened=i<2?st[i+1]:null}
    render();return
  }
  if(e.target.id==='tszback'){tsize=null;render();return}
  if(e.target.id==='tback'){opened='t';render();return}
  if(e.target.id==='tok'){
    const b=$('cb').value.trim(), z=$('cs').value.trim(), pv=$('cp').value;
    if(pv===''||!(parseFloat(pv)>=0)){$('cerr').textContent='ใส่ราคายางก่อน';return}
    if(!b){$('cerr').textContent='ใส่ยี่ห้อยาง';return}
    customTire={brand:b,size:z,price:parseFloat(pv)};tire='custom';opened=null;render();return
  }
  if(p&&!p.disabled){
    const k=p.dataset.k, id=p.dataset.id;
    if(k==='ts'){tsize=id;render();return}
    if(k==='m'){if(+id===cur){opened='w';render();return}selectModel(+id);opened='w';render();return}
    if(k==='w'){if(wheel===id){opened='t';render();return}wheel=id;const rt=TIRES[getW().rim]||[];tire=rt.length===1?rt[0].id:null;opened=tire?null:'t';render();return}
    if(k==='t'){
      if(id==='custom'){const sz=p.dataset.size||'', c=customTire&&customTire.size===sz?customTire:null;draft={brand:c?c.brand:'',size:sz,price:c?c.price:''};opened='tc';render();return}
      const x=(TIRES[getW().rim]||[]).find(y=>y.id===id);
      if(x&&x.price==null){draft={brand:'',size:x.name,price:''};opened='tc';render();return}
      tire=id;customTire=null;opened=null;render();return
    }
  }
  if(g){if(g.disabled)return;const k=g.dataset.t;opened=opened===k?null:k;render();return}
  if(opened&&(e.target.id==='pop'||e.target.id==='pcl')){opened=null;render()}
});
$('list').addEventListener('change',e=>{
  if(e.target.dataset.k!=='o')return;
  const id=e.target.dataset.id;
  if(id==='lift2'){
    if(e.target.checked){picked.add('lift2');LIFT.forEach(i=>picked.delete(i))}
    else{picked.delete('lift2');MODELS[cur].locked.forEach(i=>picked.add(i))}
    render();return
  }
  if(LIFT.includes(id)){e.target.checked=picked.has(id);return}
  e.target.checked?picked.add(id):picked.delete(id);
  calc();
});
let text='';
$('sum').onclick=()=>{
  if(cur<0||!getW()||!getT()){const g=$(cur<0?'v-m':(getW()?'v-t':'v-w'));g.classList.add('err');g.scrollIntoView({behavior:'smooth',block:'center'});return}
  const m=MODELS[cur];
  const items=chosen();
  const sub=items.reduce((s,o)=>s+o.price,0);
  $('mt').textContent='สรุป '+m.name;
  $('mb').innerHTML=items.map(o=>`<div class="sr"><span>${o.name}</span><b>${fmt(o.price)}</b></div>`).join('')
   +`<div class="sr"><span>รวมรายการ</span><b>${fmt(sub)}</b></div>`
   +`<div class="sr neg"><span>เทิร์น</span><b>${fmt(m.turn)}</b></div>`
   +`<div class="sr t"><span>สุทธิ</span><span>${fmt(sub+m.turn)}</span></div>`;
  text=m.name+'\n'+items.map(o=>`- ${o.name}\n✅ ${fmt(o.price)} บาท`).join('\n')
   +`\n--------------------------------\nรวม ${fmt(sub)} บาท\nเทิร์น ${fmt(m.turn)} บาท\n==================\nสุทธิ ${fmt(sub+m.turn)} บาท\n==================`;
  $('modal').classList.add('show');
};
$('close').onclick=()=>$('modal').classList.remove('show');
$('copy').onclick=async()=>{
  let ok=false;
  try{await navigator.clipboard.writeText(text);ok=true}catch(e){
    try{const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();ok=document.execCommand('copy');t.remove()}catch(e2){}
  }
  $('copy').textContent=ok?'คัดลอกแล้ว ✓':'คัดลอกไม่ได้';
  setTimeout(()=>$('copy').textContent='คัดลอก',1500);
};
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')$('modal').classList.remove('show')});
opened='m';render();
</script>
</body>
</html>
